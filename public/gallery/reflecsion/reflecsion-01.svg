<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <radialGradient id="r1-bg" cx="50%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#0d141d" />
      <stop offset="100%" stop-color="#05080d" />
    </radialGradient>
    <pattern id="r1-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#24303e" stroke-width="1" />
    </pattern>
    <marker id="r1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8fa3" />
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="url(#r1-bg)" />
  <rect width="1600" height="1000" fill="url(#r1-grid)" opacity="0.3" />

  <!-- boxes -->
  <g fill="#0d141d" stroke="#24303e" stroke-width="2">
    <rect x="90" y="250" width="400" height="180" rx="4" />
    <rect x="600" y="250" width="400" height="180" rx="4" />
    <rect x="1110" y="250" width="400" height="180" rx="4" />
    <rect x="90" y="700" width="400" height="180" rx="4" />
    <rect x="600" y="700" width="400" height="180" rx="4" />
  </g>

  <!-- arrows -->
  <g stroke="#7d8fa3" stroke-width="2" fill="none" marker-end="url(#r1-arrow)">
    <path d="M 490 340 L 600 340" />
    <path d="M 1000 340 L 1110 340" />
    <path d="M 800 430 L 800 700" />
    <path d="M 290 700 L 290 430" />
  </g>

  <!-- labels -->
  <g fill="#e8eef4" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="40" text-anchor="middle">
    <text x="290" y="330">Obsidian</text>
    <text x="800" y="330">Bun</text>
    <text x="1310" y="330">sherpa-onnx</text>
    <text x="290" y="780">downloader</text>
    <text x="800" y="780">.md</text>
  </g>
  <g fill="#7d8fa3" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="24" text-anchor="middle">
    <text x="290" y="380">plugin</text>
    <text x="800" y="380">child process</text>
    <text x="1310" y="380">GigaAM v3</text>
    <text x="290" y="830">~90 MB + ~320 MB</text>
    <text x="800" y="830">.m4a &#8594; text</text>
  </g>

  <circle cx="1490" cy="280" r="4" fill="#ff8a3d" />
</svg>
